<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Want List | LUXE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    .wish-header { background-color: var(--color-primary); color: var(--color-text-light); padding: 100px 0 40px; text-align: center; }
    .wish-container { max-width: var(--container-width); margin: 0 auto; padding: 60px 20px; }
    
    .wish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
    
    /* Product Overrides for Wishlist */
    .product-card { background: #fff; transition: transform var(--transition-normal); border: 1px solid var(--color-gray-light); }
    .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-sm); border-color: transparent; }
    .product-image { height: 280px; overflow: hidden; position: relative; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-remove-wishlist {
      position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.9); width: 35px; height: 35px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--color-gray);
      z-index: 10; transition: color 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-remove-wishlist:hover { color: #e74c3c; }

    .product-info { padding: 20px; text-align: center; }
    .product-brand { font-size: 0.8rem; color: var(--color-gray); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; }
    .product-title { font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 10px; }
    .product-price { font-size: 1.1rem; font-weight: 500; margin-bottom: 15px;}
    
    .wishlist-actions { display: flex; gap: 10px; }
    .btn-wish-cart { flex: 1; padding: 12px; background: var(--color-primary); color: #fff; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    .btn-wish-cart:hover { background: var(--color-accent); color: var(--color-primary); }

    /* Empty state */
    .empty-wishlist { text-align: center; padding: 80px 0; }
    .empty-wishlist i { font-size: 4rem; color: #eee; margin-bottom: 20px; }
    .empty-wishlist h3 { font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 15px; }
  </style>
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
      <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="LUXE Logo" class="brand-logo"> LUXE</a>
      <nav class="nav-links">
        <a href="index.html">Home 1</a>
        <a href="index-2.html">Home 2</a>
        <a href="shop.html">Shop</a>
        <a href="subscription.html">Discovery Box</a>
        <a href="deals.html">Deals</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-actions">
        <button aria-label="Search"><i class="fas fa-search"></i></button>
        <a href="user-dashboard.html" aria-label="Account"><i class="far fa-user"></i></a>
        <a href="wishlist.html" class="active" aria-label="Wishlist"><i class="far fa-heart"></i></a>
        <a href="cart.html" aria-label="Cart"><i class="fas fa-shopping-bag"></i></a>
      </div>
    </div>
  </header>

  <div class="wish-header">
    <h1 class="section-title text-light" style="color: white; margin-bottom:0;">Want List</h1>
  </div>

  <div class="wish-container">
    <div class="wish-grid">
      
      <!-- Item 1 -->
      <div class="product-card">
        <button class="btn-remove-wishlist" title="Remove"><i class="fas fa-times"></i></button>
        <div class="product-image">
          <a href="product-details.html"><img src="https://images.unsplash.com/photo-1595425970377-c9703bc48b2d?auto=format&fit=crop&q=80&w=400" alt="Byredo Gypsy Water"></a>
        </div>
        <div class="product-info">
          <div class="product-brand">Byredo</div>
          <h3 class="product-title">Gypsy Water</h3>
          <div class="product-price">From ₹900</div>
          <div class="wishlist-actions">
            <button class="btn-wish-cart">Move to Cart</button>
          </div>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="product-card">
        <button class="btn-remove-wishlist" title="Remove"><i class="fas fa-times"></i></button>
        <div class="product-image">
          <a href="product-details.html"><img src="https://images.unsplash.com/photo-1615309033306-05646f8fb049?auto=format&fit=crop&q=80&w=400" alt="Dior Sauvage Elixir"></a>
        </div>
        <div class="product-info">
          <div class="product-brand">Dior</div>
          <h3 class="product-title">Sauvage Elixir</h3>
          <div class="product-price">From ₹950</div>
          <div class="wishlist-actions">
            <button class="btn-wish-cart">Move to Cart</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Example of empty state (can be toggled by dev later) -->
    <!--
    <div class="empty-wishlist">
      <i class="far fa-heart"></i>
      <h3>Your Want List is empty.</h3>
      <p style="color: var(--color-gray); margin-bottom: 25px;">Find decants you love and save them here for later.</p>
      <a href="shop.html" class="btn btn-outline">Discover Scents</a>
    </div>
    -->
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
