<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | LUXE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    .error-container { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .error-code { font-size: 8rem; font-family: var(--font-serif); color: var(--color-primary); line-height: 1; margin-bottom: 20px; }
    .error-message { font-size: 1.5rem; margin-bottom: 30px; color: var(--color-gray); }
  </style>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>
<body>
  
  <div class="error-container">
    <div>
      <div class="error-code">404</div>
      <div class="error-message">This scent cannot be found.</div>
      <p style="color: var(--color-gray); margin-bottom: 40px; max-width: 400px; margin-left: auto; margin-right: auto;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="index.html" class="btn btn-primary" style="padding: 15px 40px;">Return to Home</a>
    </div>
  </div>

</body>
</html>
